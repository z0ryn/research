<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Proxy</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    width: 90%;
    max-width: 700px;
    text-align: center;
}

h1 {
    margin-bottom: 20px;
}

.input-group {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    padding: 15px 25px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}
</style>
</head>
<body>

<div class="container">
    <h1>Secure Proxy</h1>

    <div class="input-group">
        <input id="urlInput" type="text" placeholder="example.com">
        <button onclick="go()">Go</button>
    </div>
</div>

<script>
function go() {
    let url = document.getElementById("urlInput").value.trim();

    if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
    }

    window.location.href =
  "https://zoryntech-api.zoryndev.workers.dev/" +
  encodeURIComponent(url);
}

document.getElementById("urlInput").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        go();
    }
});
</script>

</body>
</html>
